services:
  postgres:
    image: postgres:18-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
    environment:
      POSTGRES_USER: agentickode
      POSTGRES_PASSWORD: agentickode
      POSTGRES_DB: agentickode
    volumes:
      # Existing PostgreSQL 16 data requires migration; see claudedocs/docker-upgrades-2026-11-15.md.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentickode"]
      interval: 2s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend.dev
    # Resolve "host-gateway" to the Docker host so the platform server can
    # optionally SSH to the host (opt-in via PLATFORM_SSH_HOST). Harmless otherwise.
    extra_hosts:
      - "host-gateway:host-gateway"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://agentickode:agentickode@postgres:5432/agentickode
      UVICORN_RELOAD: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./tests:/app/tests
      - ./pyproject.toml:/app/pyproject.toml
      - ./alembic.ini:/app/alembic.ini
      - ./alembic:/app/alembic
      - ./.ssh:/app/.ssh
      - ./CLAUDE.md:/app/CLAUDE.md:ro
      - ./.claude/skills:/app/.claude/skills:ro
      # Host Docker access for local sandbox execution
      - /var/run/docker.sock:/var/run/docker.sock
      # Persist workspaces (project clones) across rebuilds
      - workspaces:/workspaces
      # Persist agent binaries and credentials across rebuilds
      - agent-binaries:/root/.local
      - agent-config-claude:/root/.claude
      - agent-config-codex:/root/.codex
      - agent-config-gemini:/root/.gemini
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend.dev
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/tsconfig.app.json:/app/tsconfig.app.json
      - ./frontend/tsconfig.node.json:/app/tsconfig.node.json
      - ./frontend/tailwind.config.js:/app/tailwind.config.js
      - ./frontend/postcss.config.js:/app/postcss.config.js
      - ./frontend/eslint.config.js:/app/eslint.config.js
    restart: unless-stopped

volumes:
  pgdata:
    name: agentickode-app_pgdata
  redisdata:
    name: agentickode-app_redisdata
  workspaces:
    name: agentickode-app_workspaces
  agent-binaries:
    name: agentickode-app_agent-binaries
  agent-config-claude:
    name: agentickode-app_agent-config-claude
  agent-config-codex:
    name: agentickode-app_agent-config-codex
  agent-config-gemini:
    name: agentickode-app_agent-config-gemini
